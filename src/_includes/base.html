<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/base.css' | url }}" />
    <title>{{ title }}</title>
    <meta
      name="description"
      content="{{ description | escape }}"
    />
    <link
      rel="canonical"
      href="{{ canonical }}"
    />

    <!-- Open Graph (text-only — image still waits on the visual-identity session) -->
    <meta property="og:title" content="{{ title | escape }}" />
    <meta
      property="og:description"
      content="{{ description | escape }}"
    />
    <meta
      property="og:url"
      content="{{ canonical }}"
    />
    <meta property="og:type" content="website" />

    <!--all my accounts links - add more links whenever there is new accounts-->
    <link rel="me" href="https://github.com/Tarek-Elzoghby" />
    <link rel="me" href="https://www.linkedin.com/in/tarek-elzoghby/" />
    <link rel="me" href="https://hashnode.com/@Tarek-Elzoghby" />
    <link rel="me" href="https://dev.to/tarek_elzoghby" />
    <link rel="me" href="https://coderlegion.com/user/Tarek-Elzoghby" />
    <link rel="me" href="https://codepen.io/Tarek-Elzoghby" />
    <link
      rel="me"
      href="https://www.frontendmentor.io/profile/Tarek-Elzoghby"
    />

    <!-- JSON-LD Person structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tarek Elzoghby",
        "alternateName": "طارق الزغبي",
        "jobTitle": "Frontend Developer",
        "url": "https://tarek-elzoghby.github.io/tarek-elzoghby-hub/",
        "sameAs": [
          "https://github.com/Tarek-Elzoghby",
          "https://www.linkedin.com/in/tarek-elzoghby/",
          "https://hashnode.com/@Tarek-Elzoghby",
          "https://dev.to/tarek_elzoghby",
          "https://coderlegion.com/user/Tarek-Elzoghby",
          "https://www.frontendmentor.io/profile/Tarek-Elzoghby",
          "https://codepen.io/Tarek-Elzoghby"
        ]
      }
    </script>

    <!-- <link rel="icon" href="favicon.ico"> -->
  </head>
  <body>
    {{ content }}
  </body>
</html>
