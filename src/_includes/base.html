<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/base.css' | url }}" />
    <title>{{ title | escape }}</title>
    <meta name="description" content="{{ description | escape }}" />
    <link rel="canonical" href="{{ canonical }}" />

    <!-- Open Graph (text-only — image still waits on the visual-identity session) -->
    <meta property="og:title" content="{{ title | escape }}" />
    <meta property="og:description" content="{{ description | escape }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:type" content="{{ ogType | default: 'website' }}" />

    <!--all my accounts links - add more links whenever there is new accounts-->
    {% for account in accounts %}
    <link rel="me" href="{{ account.url }}" />
    {% endfor %}

    <!-- JSON-LD Person structured data -->
    <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Tarek Elzoghby",
            "alternateName": "طارق الزغبي",
            "jobTitle": "Frontend Developer",
            "url": "https://tarek-elzoghby.github.io/tarek-elzoghby-hub/",
            "sameAs": [
      {% for account in accounts %}"{{ account.url }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
            ]
          }
    </script>

    <!-- <link rel="icon" href="favicon.ico"> -->
  </head>
  <body>
    <!--skip to main content link-->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    {{ content }}
  </body>
</html>
